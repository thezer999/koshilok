<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoWallet — Мой Кошелек</title>
  <!-- Подключаем шрифты и иконки -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .wallet-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
    }

    /* Шапка */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .greeting p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .greeting h4 {
      font-size: 16px;
    }

    /* Карточка баланса */
    .balance-card {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      padding: 24px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
    }

    .balance-title {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .balance-amount {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    /* Кнопки действий */
    .actions {
      display: flex;
      justify-content: space-around;
      gap: 12px;
    }

    .action-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 10px 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      backdrop-filter: blur(5px);
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* История транзакций */
    .transactions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .transactions-header h3 {
      font-size: 18px;
    }

    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 250px;
      overflow-y: auto;
    }

    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--bg-color);
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .tx-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tx-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tx-icon.income { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .tx-icon.expense { background: rgba(239, 68, 68, 0.15); color: var(--red); }

    .tx-details p { font-weight: 600; font-size: 14px; }
    .tx-details span { font-size: 11px; color: var(--text-muted); }

    .tx-amount { font-weight: 700; font-size: 15px; }
    .tx-amount.income { color: var(--green); }
    .tx-amount.expense { color: var(--text-main); }
  </style>
</head>
<body>

  <div class="wallet-container">
    <!-- Шапка -->
    <div class="header">
      <div class="user-info">
        <div class="avatar">АВ</div>
        <div class="greeting">
          <p>С возвращением,</p>
          <h4>Александр V.</h4>
        </div>
      </div>
      <i class="fa-solid fa-bell" style="color: var(--text-muted); cursor: pointer;"></i>
    </div>

    <!-- Главная карточка баланса -->
    <div class="balance-card">
      <div class="balance-title">Текущий баланс</div>
      <div class="balance-amount" id="balance">$1,245.50</div>
      <div class="actions">
        <button class="action-btn" onclick="deposit()"><i class="fa-solid fa-arrow-down"></i> Пополнить</button>
        <button class="action-btn" onclick="send()"><i class="fa-solid fa-arrow-up-right-from-square"></i> Перевести</button>
      </div>
    </div>

    <!-- История операций -->
    <div class="transactions">
      <div class="transactions-header">
        <h3>История операций</h3>
        <span style="font-size: 12px; color: var(--accent); cursor: pointer;">Все</span>
      </div>

      <div class="tx-list" id="tx-list">
        <!-- Транзакция 1 -->
        <div class="tx-item">
          <div class="tx-left">
            <div class="tx-icon income"><i class="fa-solid fa-arrow-down"></i></div>
            <div class="tx-details">
              <p>Пополнение</p>
              <span>Сегодня, 14:20</span>
            </div>
          </div>
          <div class="tx-amount income">+$150.00</div>
        </div>

        <!-- Транзакция 2 -->
        <div class="tx-item">
          <div class="tx-left">
            <div class="tx-icon expense"><i class="fa-solid fa-bag-shopping"></i></div>
            <div class="tx-details">
              <p>Покупка (Steam)</p>
              <span>Вчера, 19:45</span>
            </div>
          </div>
          <div class="tx-amount expense">-$29.99</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentBalance = 1245.50;

    function updateBalanceDisplay() {
      document.getElementById('balance').innerText = `$${currentBalance.toFixed(2)}`;
    }

    function deposit() {
      const amount = parseFloat(prompt("Введите сумму для пополнения ($):", "50"));
      if (amount && amount > 0) {
        currentBalance += amount;
        updateBalanceDisplay();
        addTransaction("Пополнение", amount, true);
      }
    }

    function send() {
      const amount = parseFloat(prompt("Введите сумму перевода ($):", "20"));
      if (amount && amount > 0) {
        if (amount > currentBalance) {
          alert("Недостаточно средств на балансе!");
        } else {
          currentBalance -= amount;
          updateBalanceDisplay();
          addTransaction("Перевод", amount, false);
        }
      }
    }

    function addTransaction(title, amount, isIncome) {
      const list = document.getElementById('tx-list');
      const item = document.createElement('div');
      item.className = 'tx-item';
      
      const iconClass = isIncome ? 'fa-arrow-down' : 'fa-arrow-up';
      const typeClass = isIncome ? 'income' : 'expense';
      const sign = isIncome ? '+' : '-';

      item.innerHTML = `
        <div class="tx-left">
          <div class="tx-icon ${typeClass}"><i class="fa-solid ${iconClass}"></i></div>
          <div class="tx-details">
            <p>${title}</p>
            <span>Только что</span>
          </div>
        </div>
        <div class="tx-amount ${typeClass}">${sign}$${amount.toFixed(2)}</div>
      `;

      list.insertBefore(item, list.firstChild);
    }
  </script>
</body>
</html>
